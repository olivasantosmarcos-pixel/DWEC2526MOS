<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>querySelectorAll</title>

  <style>
    p {
      padding: 8px;
      background: #eee;
      margin: 5px 0;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <p>Párrafo 1</p>
  <p>Párrafo 2</p>
  <p>Párrafo 3</p>

  <script>
    const parrafos = document.querySelectorAll("p");

    
    parrafos[0].style.color = "red";
    parrafos[1].style.color = "blue";
    parrafos[2].style.color = "green";
  </script>

</body>
</html>
