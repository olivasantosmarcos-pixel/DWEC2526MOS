<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>querySelector</title>

  <style>
    .caja {
      padding: 15px;
      background: lightgray;
      width: 200px;
      text-align: center;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="caja">Caja original</div>

  <script>
    const caja = document.querySelector(".caja");
    caja.style.background = "yellow";
    caja.textContent = "Modificado con querySelector";
  </script>

</body>
</html>
