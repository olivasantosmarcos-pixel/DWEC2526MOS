<!DOCTYPE html>
<html>
<body>

<button onclick="empezar()">Empezar</button>
<button onclick="parar()">Parar</button>

<script>
let contador = 0;
let id;

function empezar() {
  id = setInterval(() => {
    contador++;
    console.log("Contador:", contador);
  }, 1000);
}

function parar() {
  clearInterval(id);
}
</script>

</body>
</html>
